name: Mobile Implementation Task
description: Track Mobile implementation work
title: "[Mobile] "
labels: ["enhancement", "mobile", "flutter"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Mobile Implementation Task
        Use this template to track mobile features development work.

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of mobile work is this?
      options:
        - Widget
        - Screen
        - Navigation
        - State Management
        - Infrastructure
        - Styling / Theming
        - Tests
        - API Integration
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Task Description
      description: What needs to be implemented?
      placeholder: |
        Implement a reusable `LoginScreen` widget that handles user input, validation and calls the auth service.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What must be completed? (Use checkboxes)
      placeholder: |
        - [ ] Create `lib/widgets/LoginScreen.dart` (with tests)
        - [ ] Add form validation and inline error messages
        - [ ] Integrate with auth service for login
        - [ ] Show loading state and error handling in the UI
        - [ ] Add unit tests (coverage for form logic) and widget tests
        - [ ] Ensure widget is accessible (semantic labels, keyboard navigation)
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Implementation Details
      description: Any specific requirements or technical details?
      placeholder: |
        - Use Flutter + Dart
        - Follow Material Design guidelines
        - Use Provider for state management if needed
        - Keep animations minimal and performant

  - type: textarea
    id: references
    attributes:
      label: References & Documentation
      description: Links to relevant docs, guides, or examples
      placeholder: |
        - [Material Design Guidelines](https://material.io/design)
        - [Flutter Documentation](https://flutter.dev/docs)
        - Example widget: `lib/widgets/Button.dart`

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: What issues must be completed first?
      placeholder: |
        Depends on: #12 (API: login endpoint), #34 (Auth service scaffolding)

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Which milestone does this belong to?
      options:
        - Backend API Implementation
        - Frontend Development
        - Mobile Development
        - Database Setup
        - Testing & QA
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Critical (Blocks other work)
        - P1 - High (Core functionality)
        - P2 - Medium (Important but not blocking)
        - P3 - Low (Nice to have)
    validations:
      required: true

  - type: checkboxes
    id: mvp
    attributes:
      label: MVP Status
      description: Is this required for MVP?
      options:
        - label: Required for MVP
        - label: Post-MVP enhancement
